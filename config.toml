[tia]
# Full path to the AleFire-Library .al20 global library file
library_path = "C:/Users/user015/Desktop/Projects/tia-knowledge/library/AleFire-Library/AleFire-Library.al20"

# Full path to the .ap20 export staging project (must have hardware config with at least one PLC)
project_path = "C:/Users/user015/Desktop/Projects/tia-knowledge/Library_export/Library_export.ap20"

# TIA Portal version to attach to, e.g. "19.0". Leave empty to use latest installed.
version = ""

[export]
# Output directories for exported blocks and UDTs (relative to repo root)
fb_output_dir  = "raw/FBs"
udt_output_dir = "raw/UDTs"

# Export format
format = "ExternalSource"

# Ctrl FB overrides — for library FBs not yet exported to raw/.
# Add entries here when a controlling FB exists in the library but is absent from raw/.
# Format: udt = UDT name, name = FB block name, param = VAR_IN_OUT parameter name.
[[manifest.ctrl_overrides]]
udt   = "UDT_SS_Valve"
name  = "SS_valve"
param = "XV"

[[manifest.ctrl_overrides]]
udt   = "UDT_DS_Valve"
name  = "DS_valve"
param = "XV"

[[manifest.ctrl_overrides]]
udt   = "UDT_Solenoid_valve"
name  = "Solenoid_valve"
param = "XY"

[[manifest.ctrl_overrides]]
udt   = "UDT_Pinch_Valve"
name  = "Pinch_valve"
param = "XV"
