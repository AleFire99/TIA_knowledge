server {
    listen 80;

    # Live manifest JSON — served straight off the bind-mounted dist/ dir (see
    # `docker run -v .../dist:/data:ro`), so a fresh scripts/ingest.py run is visible
    # on the next request with no image rebuild or container restart.
    location /api/manifest {
        alias /data/library_manifest.json;
        add_header Content-Type application/json;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
