# Piston_no_sensors — command-driven linear actuator, no position feedback.
# Source: raw/Types/99 - Library/Objects/Linear actuators/Piston no sensors/Piston_no_sensors.s7dcl. Doc: docs/it/library/linear-actuators/no-sensors/index.md.

schema_version: "1.0"
fb: Piston_no_sensors
udt: UDT_Piston_no_sensors
source: Types/99 - Library/Objects/Linear actuators/Piston no sensors/Piston_no_sensors.s7dcl

label: PISTON

states:
  - id: RETRACTED
    value: 1
    outputs: { XY: false }
    description: piston retracted, embedded solenoid de-energized
  - id: EXTENDED
    value: 2
    outputs: { XY: true }
    description: piston extended, embedded solenoid energized

transitions:
  - { from: "[*]", to: RETRACTED }
  - { from: RETRACTED, to: EXTENDED, guard: desired_command }
  - { from: EXTENDED, to: RETRACTED, guard: "!desired_command" }

notes:
  - "no position feedback exists on this variant, so the state reflects only the last command issued to the embedded solenoid valve (XY), never a confirmed physical position — the transition is immediate, same as Solenoid_valve's own FSM."
  - "the Piston_no_sensors FB was bumped 0.0.1 -> 0.0.2 in commit 59ade85 (comment: 'Updated UDT name'), which flagged this device in dist/ingest_delta.json's needs_doc_update. Investigated (issue #13): the version bump was metadata/comment-only — git diff 59ade85^ 59ade85 on Piston_no_sensors.s7dcl and UDT_Piston_no_sensors.s7dcl is empty, and the VAR_IN_OUT declaration has read UDT_Piston_no_sensors at every point in tracked git history, including the original ingest commit 0ec40e3. No SCL/state content actually changed, so this file is unchanged."
