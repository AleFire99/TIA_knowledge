# Filter_1_sleeve — single-sleeve filter cleaner (open-loop pulse cleaning).
# Source: raw/Types/99 - Library/Objects/Filters/1-sleeve/Filter_1_sleeve.s7dcl. Doc: docs/it/library/filters/1-sleeve/index.md.

schema_version: "1.0"
fb: Filter_1_sleeve
udt: UDT_Filter_1_sleeve
source: Types/99 - Library/Objects/Filters/1-sleeve/Filter_1_sleeve.s7dcl

label: FILTER_1_SLEEVE

states:
  - id: IDLE
    outputs: { XY: false }
    description: filter inactive, XY de-energized
  - id: ACTIVE
    children:
      - id: WAITING
        outputs: { XY: false }
        description: paused between pulses, interval_timer running
      - id: PULSING
        outputs: { XY: true }
        description: cleaning pulse active, pulse_timer running

transitions:
  - { from: "[*]", to: IDLE }
  - { from: IDLE, to: ACTIVE, guard: desired_command }
  - { from: ACTIVE, to: IDLE, guard: "!desired_command" }
  - { from: "[*]", to: ACTIVE.PULSING }
  - { from: ACTIVE.PULSING, to: ACTIVE.WAITING, guard: pulse_timer.Q }
  - { from: ACTIVE.WAITING, to: ACTIVE.PULSING, guard: interval_timer.Q }

guard_formulas:
  - name: desired_command
    expression: (CMD.manual_mode AND CMD.manual) OR (NOT CMD.manual_mode AND CMD.auto)

timers:
  - name: interval_timer
    active_states: [ACTIVE.WAITING]
    param: SETTING.interval_duration
    raises: feeds the WAITING -> PULSING guard, starting the next cleaning pulse
  - name: pulse_timer
    active_states: [ACTIVE.PULSING]
    param: SETTING.pulse_duration
    raises: feeds the PULSING -> WAITING guard, ending the pulse

notes:
  - "ACTIVE always initializes its substate to PULSING — both on first scan and every time IDLE -> ACTIVE fires — so the cycle always opens with an immediate cleaning pulse, matching Filter_2_sleeves' behavior exactly (this FB previously initialized to WAITING instead; the raw source was corrected to align the two filter FBs)."
  - "No ALARMS struct exists on this UDT: the cleaning cycle is open-loop (no position/pressure feedback on the sleeve), so there is no sensor state to base a fault detection on."
