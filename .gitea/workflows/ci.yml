# CI validation + registry publish for tia-knowledge. No test suite exists
# (docs/config repo) — validate instead checks the things that break
# silently: raw/ -> manifest consistency, FSM yaml structure, and both
# locale site builds. publish pushes the built wiki image to this repo's own
# Gitea container registry on every develop merge (rolling `develop` preview
# tag) and on every actual release tag push (`v*` — see CLAUDE.md's Gitea
# Release Process). A plain merge into main does NOT publish by itself —
# only the follow-up `git tag vX.Y.Z && git push origin vX.Y.Z` step does.
# This is deliberate: main only ever receives release/hotfix merges, but
# publishing straight off that merge push (rather than the tag) meant every
# such merge always produced a `latest`/`vX.Y.Z` image even before the
# version was actually tagged — and if the tag and the merge ever drifted
# (a version bump forgotten before merge), the resulting tag string could
# collide with a previous release and silently overwrite it in the registry
# (this happened for real: v0.1.0-v0.4.0 all got clobbered this way before
# it was caught — see the publish job's own comments below). Gating on the
# tag push instead ties the published version tag directly to the git tag
# that names it, with no room for the two to drift apart.
#
# The runner is set up for Docker-outside-of-Docker (host /var/run/docker.sock
# mounted into act_runner itself, allow-listed via its container.valid_volumes)
# — see CLAUDE.md's Git Flow section. act_runner auto-forwards that socket into
# every job container on its own; do NOT also declare it under a job's
# container.volumes here, or container creation fails with "Duplicate mount
# point: /var/run/docker.sock".
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Gitea's own runner-images bundle a real docker CLI; DooD socket must
    # also be allow-listed in the runner's own config.yaml
    # (container.valid_volumes) or this mount is rejected even though it's
    # declared here.
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Mirrors Dockerfile's corporate-CA trust step — no-ops when certs/ has
      # no *.crt file (e.g. runner not behind the same TLS-inspecting proxy).
      # certs/ itself is tracked (README.md + .gitignore) so it's never empty
      # in CI even when the actual *.crt is gitignored/local-only — checking
      # `ls -A certs/` for that reason gives a false positive and then `cp`
      # fails on the unexpanded glob; check for the glob match directly.
      - name: Trust corporate CA (if present)
        run: |
          if ls certs/*.crt >/dev/null 2>&1; then
            sudo cp certs/*.crt /usr/local/share/ca-certificates/
            sudo update-ca-certificates
          fi

      - name: Install dependencies
        run: uv sync --native-tls

      - name: Ingest raw/ and check manifest is up to date
        run: |
          uv run --native-tls python scripts/ingest.py
          git diff --exit-code dist/library_manifest.json || {
            echo "::error::dist/library_manifest.json is stale — raw/ changed without re-running scripts/ingest.py and committing the result.";
            exit 1;
          }

      - name: Validate FSM yaml against schema
        run: uv run --native-tls python scripts/validate_fsm.py

      - name: Build site (IT, strict)
        run: uv run --native-tls zensical build --config-file zensical.it.toml --strict

      - name: Build site (EN, strict)
        run: uv run --native-tls zensical build --config-file zensical.en.toml --strict

      - name: Docker build
        run: docker build -t nte-aut-wiki:ci .

  publish:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # secrets.GITHUB_TOKEN defaults to no package access — Gitea Actions denies
    # registry pushes with it unless this job explicitly grants packages: write.
    permissions:
      contents: read
      packages: write
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VERSION comes straight from the pushed tag name (e.g. refs/tags/v0.5.0
      # -> v0.5.0), never from pyproject.toml — this is what ties the
      # published tag directly to the git tag with no room for drift. See
      # this workflow's header comment for the incident that motivated this.
      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=latest $VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tags=develop" >> "$GITHUB_OUTPUT"
          fi

      # Gitea Actions' auto-injected GITHUB_TOKEN cannot authenticate to the
      # container registry at all (confirmed: login always returns 401
      # unauthorized regardless of the job's `permissions:` block — a known
      # Gitea limitation, not something fixable from the workflow side).
      # REGISTRY_TOKEN is a personal access token (read:package + write:package
      # scope) stored as a repo Actions secret instead.
      - name: Log in to the Gitea container registry
        run: |
          REGISTRY="$(echo '${{ github.server_url }}' | sed -E 's#https?://##')"
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # A versioned tag (vX.Y.Z) must never move once published — unlike
      # `latest`/`develop`, which are expected to keep repointing. Deriving
      # VERSION from the git tag itself (above) already closes off the
      # original drift bug, but this stays as defense-in-depth against a
      # deleted-and-re-pushed tag: if the pull succeeds, that version was
      # already published and this would silently overwrite it. Fail loudly
      # instead.
      - name: Guard against overwriting an existing version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REGISTRY="$(echo '${{ github.server_url }}' | sed -E 's#https?://##')"
          IMAGE="$REGISTRY/alessandro_firetto/tia-knowledge/nte-aut-wiki"
          VERSION="${GITHUB_REF#refs/tags/}"
          if docker pull "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists in the registry. This tag was already published — delete/re-push a tag only if you know what you're doing, versioned tags must never be overwritten.";
            exit 1;
          fi

      - name: Build and push
        run: |
          REGISTRY="$(echo '${{ github.server_url }}' | sed -E 's#https?://##')"
          IMAGE="$REGISTRY/alessandro_firetto/tia-knowledge/nte-aut-wiki"
          docker build -t local-build .
          for TAG in ${{ steps.tags.outputs.tags }}; do
            docker tag local-build "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
